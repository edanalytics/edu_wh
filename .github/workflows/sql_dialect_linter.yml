name: sql_dialect_linter

on:
  pull_request:
  # Adds a manual "Run workflow" button in the Actions tab. GitHub only
  # shows that button after this file is merged to main.
  workflow_dispatch:

jobs:
  lint:
    name: sql_dialect_linter (${{ matrix.dialect }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Run both dialects even if one fails, so we get both results.
      fail-fast: false
      matrix:
        dialect: [databricks, snowflake]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Everything (sqlfluff, dbt-core, both adapters) is pinned in this one
      # file so CI always matches local dev — an older sqlfluff previously
      # produced parsing failures that this pinned version doesn't have.
      - name: Install dbt + sqlfluff
        run: pip install -r .github/workflows/requirements/sql-linter.txt

      # The lint script edits files inside dbt_packages/edu_edfi_source,
      # so those need to be downloaded first.
      - name: dbt deps
        run: dbt deps

      - name: Compile and lint (${{ matrix.dialect }})
        run: bash .github/scripts/sql_dialect_linter.sh ${{ matrix.dialect }}
