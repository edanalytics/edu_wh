version: 2

models:
  - name: fct_survey_response
    description: "Fact table for survey responses. Grain: 1 submitted survey response."
    
    config:
      tags: ['survey', 'core']
      enabled: "{{ var('src:domain:survey:enabled', False) }}"

    constraints:
      - type: primary_key
        columns: [k_survey_response]
      - type: foreign_key
        name: fk__fct_survey_question_response_value__k_survey
        columns: [k_survey]
        to: ref('dim_survey')
        to_columns: [k_survey]
      - type: foreign_key
        name: fk__fct_survey_question_response_value__k_student
        columns: [k_student]
        to: ref('dim_student')
        to_columns: [k_student]
      - type: foreign_key
        name: fk__fct_survey_question_response_value__k_staff
        columns: [k_staff]
        to: ref('dim_staff')
        to_columns: [k_staff]
      - type: foreign_key
        name: fk__fct_survey_question_response_value__k_parent
        columns: [k_parent]
        to: ref('dim_parent')
        to_columns: [k_parent]


    columns:
      - name: k_survey_response
        description: Surrogate key for survey response.
        tests:
          - unique
          - not_null

      - name: k_survey
        description: Foreign key to dim_survey. Identifies the survey associated with the response.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_survey')
                field: k_survey

      - name: k_student
        description: Foreign key to dim_student (nullable).

      - name: k_staff
        description: Foreign key to dim_staff (nullable).

      - name: k_parent
        description: Foreign key to dim_parent (nullable).

      - name: tenant_code
        description: Tenant the survey response was source from.

      - name: survey_response_id
        description: Natural key identifier for the survey response, typically from the survey application.

      - name: respondent_type
        description: >
          Type of respondent. Options include 'student', 'staff', 'parent', and 'anonymous'. 'anonymous' is used
          automatically if no student, staff, or parent association is present.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['student', 'staff', 'parent', 'anonymous']

      - name: electronic_mail_address
        description: Email address of respondent provided with the response.

      - name: full_name
        description: Full name of respondent provided with the response.

      - name: location
        description: Location of the respondent, often a city, district, or school.

      - name: response_date
        description: Date of the survey response.

      - name: completion_time_seconds
        description: Time in seconds to complete the survey.
