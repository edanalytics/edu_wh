version: 2

models:
  - name: fct_survey_question_response_value
    description: "Fact table for individual response values. Grain: 1 selected/entered value for 1 survey question response"
    config:
      tags: ['survey', 'core']
      enabled: "{{ var('src:domain:survey:enabled', False) }}"

    constraints:
      - type: primary_key
        columns: [k_survey_response, k_survey_question, question_response_value_id]
      - type: foreign_key
        name: fk__fct_survey_question_response_value__k_survey_response
        columns: [k_survey_response]
        to: ref('fct_survey_response')
        to_columns: [k_survey_response]
      - type: foreign_key
        name: fk__fct_survey_question_response_value__k_survey_question
        columns: [k_survey_question]
        to: ref('dim_survey_question')
        to_columns: [k_survey_question]
      - type: foreign_key
        name: fk__fct_survey_question_response_value__k_survey
        columns: [k_survey]
        to: ref('dim_survey')
        to_columns: [k_survey]
      - type: foreign_key
        name: fk__fct_survey_question_response_value__k_student
        columns: [k_student]
        to: ref('dim_student')
        to_columns: [k_student]
      - type: foreign_key
        name: fk__fct_survey_question_response_value__k_staff
        columns: [k_staff]
        to: ref('dim_staff')
        to_columns: [k_staff]
      - type: foreign_key
        name: fk__fct_survey_question_response_value__k_parent
        columns: [k_parent]
        to: ref('dim_parent')
        to_columns: [k_parent]

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - k_survey_response
              - k_survey_question
              - question_response_value_id
    columns:
      - name: k_survey_response
        description: "Foreign key to fct_survey_response"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_survey_response')
                field: k_survey_response

      - name: k_survey_question
        description: "Foreign key to dim_survey_question"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_survey_question')
                field: k_survey_question

      - name: question_response_value_id
        description: "Identifier for this specific response value"
        tests:
          - not_null

      - name: k_survey
        description: "Foreign key to dim_survey (for filtering/aggregation)"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_survey')
                field: k_survey

      - name: k_student
        description: "Foreign key to dim_student (nullable, from parent)"

      - name: k_staff
        description: "Foreign key to dim_staff (nullable, from parent)"

      - name: k_parent
        description: "Foreign key to dim_parent (nullable, from parent)"
      
      - name: tenant_code
        description: "Tenant the question response was sourced from"

      - name: respondent_type
        description: "Type of respondent (from parent)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['student', 'staff', 'parent', 'anonymous']

      - name: numeric_response
        description: "Numeric value of the response"

      - name: text_response
        description: >
          Text value of the response. Where the question defines response choices, this matches
          dim_survey_question_response_choice.text_value, which is the only route to the choice's
          numeric_value — numeric_response is frequently not populated by survey applications.
          May also contain delimited multi-select values, which are not parsed here.

      - name: response_date
        description: "Date response value was provided"

      - name: location
        description: "Location where response value was provided"

      - name: comment
        description: "Optional comment or explanation"

      - name: no_response
        description: "Indicator if respondent did not provide this value"