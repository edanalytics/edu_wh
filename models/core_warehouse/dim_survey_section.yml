version: 2

models:
  - name: dim_survey_section
    description: "Dimension table for survey sections. Grain: 1 section of 1 survey."

    config:
      tags: ['survey', 'core']
      enabled: "{{ var('src:domain:survey:enabled', False) }}"

    constraints:
      - type: primary_key
        columns: [k_survey_section]
      - type: foreign_key
        name: fk__dim_survey_section__k_survey
        columns: [k_survey]
        to: ref('dim_survey')
        to_columns: [k_survey]

    columns:
      - name: k_survey_section
        description: Surrogate key for survey section.
        tests:
          - unique
          - not_null

      - name: k_survey
        description: Foreign key to dim_survey. Identifies the survey the section belongs to.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_survey')
                field: k_survey

      - name: tenant_code
        description: Tenant the section was sourced from. Component of k_survey_section.

      - name: survey_section_title
        description: >
          Title of the survey section, as provided by the survey application. Also the natural key
          component distinguishing sections within a survey.
        tests:
          - not_null
