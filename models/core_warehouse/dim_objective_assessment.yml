version: 2

models:
  - name: dim_objective_assessment
    description: >
      ##### Overview:
        This dimension table defines an objective assessment (a subtest that assesses specific learning objectives) and all known characteristics.

      ##### Primary Key:
        `k_objective_assessment` -- There is one record per tenant, year, academic subject, assessment, and objective assessment.
        
    config:
      tags: ['assessment']
      enabled: "{{ var('src:domain:assessment:enabled', True) }}"

    constraints:
      - type: primary_key
        columns: [k_objective_assessment]
      - type: foreign_key
        name: fk__dim_objective_assessment__k_assessment
        columns: [k_assessment]
        to: ref('dim_assessment')
        to_columns: [k_assessment]

    columns:
      - name: k_objective_assessment
        description: >
            Generated primary key composed of `tenant_code`, `api_year`, `academicSubjectDescriptor`,
            `assessmentIdentifier`, `namespace`, and `objectiveAssessmentIdentificationCode`.
        tests: 
          - unique
      - name: k_assessment
      - name: tenant_code
      - name: school_year
        description: "School year specified by Spring year, e.g. the 2021-2022 year would be 2022. For assessment records, `school_year` is primarily populated based on the year associated with the source ODS, which is assumed to contain data for only that school year. If not available from the ODS, it is inferred from `administration_date` using a school-year cutoff date that can vary by implementation (e.g. defaulting to 8/1, meaning an assessment administered on or after 8/1/2021 and before 8/1/2022 is assigned school year 2022). Some implementations may also configure a school year crosswalk to override the ODS-sourced or inferred year for specific assessments or date ranges."
      - name: assessment_identifier
      - name: namespace
      - name: objective_assessment_description
      - name: objective_assessment_identification_code
      - name: max_raw_score
      - name: nomenclature
      - name: percent_of_assessment
      - name: academic_subject
      - name: scores_array
      - name: performance_levels_array