version: 2

models:
  - name: dim_school_calendar
    description: >
      ##### Overview:
        This dimension table defines a set of dates associated with a school.

      ##### Primary Key:
        `k_school_calendar` -- There is one record per tenant, calendar code, school, year.

    config:
      tags: ['core']


    constraints:
      - type: primary_key
        columns: [k_school_calendar]
      - type: foreign_key
        name: fk__dim_school_calendar__k_school
        columns: [k_school]
        to: ref('dim_school')
        to_columns: [k_school]
    columns:
      - name: k_school_calendar
        description: Primary key for the school calendar record.
        tests:
          - not_null
          - unique
      - name: k_school
        description: Foreign key to `dim_school`, identifying the school associated with the calendar.
      - name: tenant_code
      - name: school_year
        description: "School year specified by Spring year, e.g. the 2021-2022 year would be 2022. Unlike most other tables, `school_year` here reflects a school year reference embedded directly in the source Ed-Fi record, rather than the year of the source ODS pull — so it can differ from the pull year in edge cases (e.g. calendar or schedule data that spans a year boundary)."
      - name: calendar_code
        description: Identifier for the calendar.
      - name: calendar_type
      - name: applicable_grade_levels_array
        description: The grade level associated with the calendar.

