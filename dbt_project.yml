config-version: 2

name: 'edu_wh'
version: '0.7.0'
require-dbt-version: [">=1.10.5", "<2.0.0"]

# This setting configures which "profile" dbt uses for this project.
profile: 'edu_wh'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


models:
  edu_wh:
    +materialized: table
    build:
      +schema: build
      tpdm:
        +enabled: "{{ var('edu:tpdm:enabled', False) }}"
    core_warehouse:
      +schema: wh
    finance_warehouse:
      +schema: finance_wh
      +enabled: "{{ var('edu:finance:enabled', False) }}"
    tpdm_warehouse:
      +schema: wh
      +enabled: "{{ var('edu:tpdm:enabled', False) }}"
    qc:
      +schema: qc

vars:
  # labels for generated race/ethnicity groups
  'edu:stu_demos:multiple_races_code': Multiple
  'edu:stu_demos:hispanic_latino_code': Latinx
  'edu:stu_demos:race_unknown_code': Unknown
  
  'edu:candidate_demos:multiple_races_code': Multiple
  'edu:candidate_demos:hispanic_latino_code': Latinx
  'edu:candidate_demos:race_unknown_code': Unknown

  # custom intersections of other demographic groupings
  'edu:stu_demos:intersection_groups': Null
  # custom data sources for student characteristics. must contain and be unique by `k_student`
  'edu:stu_demos:custom_data_sources': Null

  # Optional override logic when enrollment grade level != true grade level.
  'edu:stu_demos:grade_level_override': Null
  
  # rules for inclusion in program associations
  # Begin and end dates to use for cutoffs, and a list of program names to exclude
  'edu:homeless:start_date_column': program_enroll_begin_date
  'edu:homeless:exit_date_column': program_enroll_end_date
  'edu:homeless:exclude_programs': Null
  'edu:homeless:agg_types': ['annual', 'active']

  'edu:language_instruction:start_date_column': program_enroll_begin_date
  'edu:language_instruction:exit_date_column': program_enroll_end_date
  'edu:language_instruction:exclude_programs': Null
  'edu:language_instruction:agg_types': ['annual', 'active']

  'edu:special_ed:start_date_column': program_enroll_begin_date
  'edu:special_ed:exit_date_column': program_enroll_end_date
  'edu:special_ed:exclude_programs': Null
  'edu:special_ed:agg_types': ['annual', 'active']

  'edu:title_i:start_date_column': program_enroll_begin_date
  'edu:title_i:exit_date_column': program_enroll_end_date
  'edu:title_i:exclude_programs': Null
  'edu:title_i:agg_types': ['annual', 'active']

  'edu:cte:start_date_column': program_enroll_begin_date
  'edu:cte:exit_date_column': program_enroll_end_date
  'edu:cte:exclude_programs': Null
  'edu:cte:agg_types': ['annual', 'active']

  'edu:food_service:start_date_column': program_enroll_begin_date
  'edu:food_service:exit_date_column': program_enroll_end_date
  'edu:food_service:exclude_programs': Null
  'edu:food_service:agg_types': ['annual', 'active']

  'edu:migrant_education:start_date_column': program_enroll_begin_date
  'edu:migrant_education:exit_date_column': program_enroll_end_date
  'edu:migrant_education:exclude_programs': Null
  'edu:migrant_education:agg_types': ['annual', 'active']

  # label for 'Present' days generated from negative attendance
  'edu:attendance:in_attendance_code': In Attendance
  # threshold and minimum enrolled days for chronic absence definition
  'edu:attendance:chronic_absence_threshold': 90
  'edu:attendance:chronic_absence_min_days': 20
  # number of is_school_day calendar events required to mark a school day
  'edu:attendance:num_school_day_calendar_events': 1

  # withdraw codes that should exclude students from enrollment altogether
  'edu:enroll:exclude_withdraw_codes': ['No show', 'Invalid enrollment']
  
  # student discipline participation codes that map to non-offenders
  'edu:discipline:non_offender_codes': ['Victim', 'Witness', 'Reporter']

  'edu:schools:custom_indicators': Null

  # assessment_identifier values to include in msr_student_cumulative_assessment_score
  # and msr_student_cumulative_objective_assessment_score; empty = all
  'edu:assessment:assessment_identifiers': []
  # assessment_family values to include; empty = all; applied alongside assessment_identifiers
  'edu:assessment:assessment_families': []
  # superscores to compute in msr_student_superscore; dict keyed by assessment_identifier
  # each entry: {subscore_codes: [...], method: sum_of_max}
  'edu:assessment:superscores': {}

  # gpa_type from fct_student_gpa to use in msr_student_cumulative_gpa; null = no filter (all types)
  'edu:gpa:gpa_type': ~
  # academic_term values to include; empty = all terms
  'edu:gpa:academic_terms': []
  # when true, restricts to is_cumulative = true; set false if the gpa_type is not flagged as cumulative
  'edu:gpa:cumulative_only': true

  # subject fields from dim_course to group by in msr_student_cumulative_course_credits
  # each entry produces its own subject_type rows; extend with partner-specific fields as needed
  'edu:course:subject_fields': ['academic_subject']

  # transcript-derived columns to add as cross-cut grouping dimensions; dict of {field_name: sql_expression}
  # expressions may reference fct_course_transcripts directly; null in output = rolled up across all values
  'edu:course:transcript_grouping_fields': {}
